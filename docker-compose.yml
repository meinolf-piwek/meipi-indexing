x-watcher: &watcher-base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    tika:
      condition: service_healthy
  networks:
    - postgresql_default

# Merged into each watcher service. A child ``environment`` block replaces (not
# merges with) the anchor's ``environment``, so DB settings must be included here.
x-watcher-env: &watcher-env
  IND_PG_HOST: ${IND_PG_HOST:-pg-db}
  IND_PG_PORT: ${IND_PG_PORT:-5432}
  IND_PG_USER: ${IND_PG_USER:-postgres}
  IND_PG_PASSWD: ${IND_PG_PASSWD:-postgres}
  IND_PG_DATABASE: ${IND_PG_DATABASE:-postgres}
  IND_PG_SCHEMA: ${IND_PG_SCHEMA:-meipi-indexing}
  IND_TIKA_NOOCR_URL: http://tika:9998
  IND_DOCROOT: /data

services:
  tika:
    image: apache/tika:latest-full
    restart: unless-stopped
    command: ["-c", "/etc/tika/tika-config.xml"]
    ports:
      - "9998:9998"
    volumes:
      - /home/padmin/.config/tika/tika-config.xml:/etc/tika/tika-config.xml:ro
    networks:
      - postgresql_default
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9998/tika || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  watcher-1:
    <<: *watcher-base
    environment:
      <<: *watcher-env
      IND_WATCH_POOL_ID: ${IND_WATCH_POOL_ID:-1}
      IND_WATCH_PATH: ${IND_WATCH_PATH:-.}
      IND_WATCH_DEBOUNCE: ${IND_WATCH_DEBOUNCE:-1.0}
      IND_WATCH_NO_THUMBS: ${IND_WATCH_NO_THUMBS:-0}
    volumes:
      - ${HOST_DATA_DIR:-./data}:/data

  watcher-2:
    <<: *watcher-base
    environment:
      <<: *watcher-env
      IND_WATCH_POOL_ID: ${IND_WATCH_POOL_ID_2:-2}
      IND_WATCH_PATH: ${IND_WATCH_PATH_2:-.}
      IND_WATCH_DEBOUNCE: ${IND_WATCH_DEBOUNCE_2:-${IND_WATCH_DEBOUNCE:-1.0}}
      IND_WATCH_NO_THUMBS: ${IND_WATCH_NO_THUMBS_2:-${IND_WATCH_NO_THUMBS:-0}}
    volumes:
      - ${HOST_DATA_DIR_2:-${HOST_DATA_DIR:-./data}}:/data

networks:
  postgresql_default:
    external: true

[tool.setuptools.packages.find]
where = ["src/"]
include = ["meipi"]
namespaces = true
[project]
name = "meipi-indexing"
version = "0.1.0"
description = "Indexing Documents mit PostgreSQL"
authors = [{ name = "Meinolf Piwek", email = "meinolf@piwek.email" }]
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.10.1",
    "click>=8.1.8",
    "cupy-cuda13x>=14.0.1",
    "dotenv>=0.9.9",
    "huggingface>=0.0.1",
    "imagehash>=4.3.2",
    "keyring>=25.6.0",
    "langchain-core>=0.3.74",
    "numpy>=2.2.6",
    "nvidia-dali-cuda130>=2.1.0",
    "pgvector>=0.4.1",
    "pillow>=11.3.0",
    "pillow-heif>=1.1.0",
    "pymupdf>=1.25.5",
    "psycopg>=3.2.10",
    "pydantic-settings>=2.13.1",
    "pylint-pydantic>=0.4.1",
    "python-xmp-toolkit>=2.0.2",
    "sentence-transformers>=5.1.0",
    "sortedcollections>=2.1.0",
    "sphinx>=9.1.0",
    "sqlalchemy>=2.0.43",
    "tika>=3.1.0",
    "tika-client>=0.11.0",
    "torch>=2.11.0",
    "torchao>=0.16.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "watchdog>=6.0.0",
    "alembic>=1.18.4",
]

[project.scripts]
meipi-index = "meipi.indexing.cmd.__main__:main"
meipi-search = "meipi.indexing.ui.app:launch"

[dependency-groups]
ui = [
    "streamlit>=1.40.0",
    "meipi-indexing",
]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "deptry>=0.23.1",
    "imageio>=2.37.0",
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
    "meipi-indexing",
    "nvidia-pyindex>=1.0.9",
    "opencv-contrib-python>=4.12.0.88",
    "pandas>=2.3.2",
    "parquet>=1.3.1",
    "rdflib>=7.1.4",
    "twine>=6.2.0",
]

[tool.uv]
environments = [
    
    "sys_platform == 'linux'",
]
[tool.uv.sources]
meipi-indexing = { workspace = true }

[tool.uv.extra-build-dependencies]
nvidia-pyindex = ["pip"]
nvidia-dali = ["pip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: tests that need a running PostgreSQL instance (MEIPI_TEST_DATABASE_URL)",
]

[tool.pyright]
venvPath= "."
venv=".venv"

[build-system]
requires = ["uv_build >= 0.8.17 ,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "meipi"
namespace = true
src-dir = "src"
